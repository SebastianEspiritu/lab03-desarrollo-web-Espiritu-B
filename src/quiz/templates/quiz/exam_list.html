{% extends 'quiz/base.html' %}

{% block title %}Exams List{% endblock %}

{% block content %}
<h2>Exams List</h2>
<div class="list-group mt-3">
    {% for exam in exams %}
        <a href="{% url 'exam_detail' exam.pk %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1">{{ exam.title }}</h5>
                <p class="mb-1 text-muted">{{ exam.description }}</p>
            </div>
            <small class="text-muted">{{ exam.created_at|date:"Y-m-d H:i" }}</small>
        </a>
    {% empty %}
        <p class="text-muted">No exams registered yet.</p>
    {% endfor %}
</div>
{% endblock %}
